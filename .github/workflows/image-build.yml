name: Image Build

on:
  workflow_dispatch: {}
  push: {}
  schedule:
    # run build every week
    - cron:  '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.distro }}:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, rockylinux]
        version: [latest]
        include:
          - distro: fedora
            version: 43
          - distro: fedora
            version: 44
          - distro: fedora
            version: rawhide
          - distro: rockylinux
            version: 8
          - distro: rockylinux
            version: 9
          - distro: rockylinux
            version: 10
    steps:
      - uses: actions/checkout@v5
      - name: Resolve container runtime
        run: |
          CLI=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker)
          echo "CONTAINER_CLI=${CLI}" >> "$GITHUB_ENV"
          echo "::notice::Using ${CLI} ($(${CLI} --version))"
      - name: Build Image
        env:
          BASE_IMAGE: quay.io/${{ matrix.distro }}/${{ matrix.distro }}:${{ matrix.version }}
          TARGET_IMAGE: rpmbuilder:${{ matrix.distro }}-${{ matrix.version }}
        run: make build
      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        env:
          TARGET_IMAGE: rpmbuilder:${{ matrix.distro }}-${{ matrix.version }}
        run: make test
      - name: Publish Image (quay.io)
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: rpmbuilder:${{ matrix.distro }}-${{ matrix.version }}
          REGISTRY: quay.io/abn
          REGISTRY_USER: ${{ secrets.QUAY_USER }}
          REGISTRY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          ${CONTAINER_CLI} tag ${IMAGE} ${REGISTRY}/${IMAGE}
          ${CONTAINER_CLI} login -u "${REGISTRY_USER}" -p "${REGISTRY_TOKEN}" quay.io
          ${CONTAINER_CLI} push ${REGISTRY}/${IMAGE}
